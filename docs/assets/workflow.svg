<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1190" viewBox="0 0 1400 1190" role="img" aria-labelledby="title desc">
<title id="title">Qwen Workflow Runner project workflow</title>
<desc id="desc">Inputs and configuration enter the browser and FastAPI. Downloads feed the model catalog. A queued job acquires reusable device resources, preprocesses inputs and references, runs Qwen inference, and saves images and records. Results return to the UI. Shutdown drains jobs and releases resources. The CLI uses the shared inference core.</desc>
